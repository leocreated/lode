<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LODE — strike first</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>⛏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,700;9..144,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="dust"></canvas>
<div class="grain"></div>

<header class="masthead">
  <div class="wordmark">
    <h1>LODE</h1>
    <div class="tagline">field instrument № 001 · strike first</div>
  </div>
  <div class="ledger" id="ledger">
    <span class="ledger-row"><em id="stat-digs">0</em> digs</span>
    <span class="ledger-row"><em id="stat-claims">0</em> claims</span>
    <span class="ledger-row"><em id="stat-paydirt">0</em> paydirt</span>
  </div>
</header>

<main>
  <!-- DIG PANEL -->
  <section class="panel dig-panel" id="dig-panel">
    <div class="panel-title"><span class="tick"></span>NEW DIG</div>
    <div class="dig-controls">
      <div class="seed-box">
        <input id="seed-input" type="text" placeholder="type a territory + Enter — e.g. cold war spies" autocomplete="off">
        <div class="chips" id="chips"></div>
      </div>
      <label class="luck-toggle" title="Require channels to overperform repeatedly. Off = show single-hit wonders too.">
        <input type="checkbox" id="luck" checked>
        <span class="luck-track"><span class="luck-thumb"></span></span>
        <span class="luck-label">luck filter</span>
      </label>
      <div class="dig-buttons">
        <button class="btn gold" id="btn-seeded">⛏ Dig seeds</button>
        <button class="btn" id="btn-sweep">Open sweep</button>
      </div>
    </div>
    <div class="dig-progress" id="dig-progress" hidden>
      <div class="pan"><div class="pan-swirl"></div></div>
      <div class="progress-text" id="progress-text">Breaking ground…</div>
    </div>
  </section>

  <!-- VEINS -->
  <section class="veins-section">
    <div class="section-head">
      <h2>Veins</h2>
      <div class="dig-meta" id="dig-meta"></div>
    </div>
    <div id="veins" class="veins"></div>
    <div id="veins-empty" class="empty">No digs yet. Break ground above.</div>
  </section>

  <!-- CLAIMS -->
  <section class="claims-section">
    <div class="section-head">
      <h2>Claims</h2>
      <button class="btn small" id="btn-refresh">Re-survey</button>
    </div>
    <div id="claims" class="claims"></div>
    <div id="claims-empty" class="empty">Stake a claim from any vein to track its momentum.</div>
  </section>

  <!-- ASSAY ARCHIVE -->
  <section class="assays-section">
    <div class="section-head"><h2>Assay office</h2></div>
    <div id="assays" class="assays"></div>
    <div id="assays-empty" class="empty">Run an assay on a vein and the report files here.</div>
  </section>
</main>

<!-- ASSAY REPORT MODAL -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="assay-report" id="assay-report">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="report-head">
      <div class="report-office">LODE ASSAY OFFICE</div>
      <div class="report-query" id="report-query"></div>
    </div>
    <div class="stamp" id="stamp"></div>
    <div class="report-body" id="report-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="dust.js"></script>
<script src="app.js"></script>
</body>
</html>
